<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Logo — Guide de marque MyDigitalSchool</title>
  <meta name="description" content="Les trois versions du logo MyDigitalSchool, sa zone de protection, ses tailles minimales, ses fonds autorisés et les neuf interdits, chacun avec sa raison.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;family=Bricolage+Grotesque:wght@800&amp;display=swap">
  <!-- Les feuilles du dépôt d’abord, la feuille du site ensuite : c’est elle qui passe le fond en blanc. -->
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <div id="entete"></div>

  <!-- Le contenu est rendu par `js/logo.js` : il lit le logo officiel, en fabrique les versions, puis pose
       la page. Ce qui est écrit ici est ce qu’on voit quand cela n’a pas pu se faire, quelle que soit la
       raison. `ds-message--attente` ne le fait apparaître qu’après un délai, pour qu’il ne clignote pas
       sur un site qui marche ; en cas d’échec attrapé plus bas, il apparaît tout de suite. -->
  <main id="contenu">
    <section class="ds-bande">
      <div class="ds-section">
        <h1 class="ds-titre-page">Le logo</h1>
        <div class="ds-message ds-message--attente" id="repli">
          <p class="body">La page n’a pas pu s’afficher. Si vous avez ouvert ce fichier directement, voici la raison.</p>
          <p class="body" id="raison">Cette page lit le fichier du logo (<code>assets/logo.svg</code>), ce qu’un navigateur refuse sur un fichier local. Ouvrez le site depuis un serveur&nbsp;: <code>npm run serve</code>.</p>
        </div>
      </div>
    </section>
  </main>

  <div id="pied"></div>

  <script type="module">
    import { enteteHtml, piedHtml } from './js/chrome.js';
    import { preparerSources, pageHtml, brancherExports } from './js/logo.js';

    // Cette page est à la racine de design-system/ : l’adresse passée au chrome est `logo.html`.
    document.getElementById('entete').outerHTML = enteteHtml('logo.html');
    document.getElementById('pied').outerHTML = piedHtml();

    const contenu = document.getElementById('contenu');
    try {
      const reponse = await fetch('assets/logo.svg');
      if (!reponse.ok) throw new Error(`le serveur répond ${reponse.status}`);
      // Les versions blanche et anthracite, et le violet du contre-exemple, sont fabriquées ici
      // depuis le fichier officiel : rien d’autre n’est stocké.
      const sources = preparerSources(
        await reponse.text(),
        (svg) => URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml' })),
      );
      contenu.innerHTML = pageHtml(sources);
      brancherExports(contenu, sources);
    } catch (erreur) {
      const repli = document.getElementById('repli');
      repli.classList.remove('ds-message--attente');
      document.getElementById('raison').textContent = `Le logo n’a pas pu être lu (${erreur.message}). Si vous avez ouvert ce fichier directement, ouvrez plutôt le site depuis un serveur : npm run serve.`;
    }
  </script>
</body>
</html>
