<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guide de marque &amp; design system — MyDigitalSchool</title>
  <meta name="description" content="Le logo, les couleurs, la typographie, le ton et les composants d’interface de MyDigitalSchool.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;family=Bricolage+Grotesque:wght@800&amp;display=swap">
  <!-- Les feuilles du dépôt d’abord, la feuille du site ensuite : c’est elle qui passe le fond en blanc. -->
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="css/site.css">
</head>
<!--
  La porte d’entrée du site, et la seule page qui n’a ni en-tête ni pied.

  Elle ne porte que la mosaïque : sept blocs qui entrent par les bords au défilement, et dont
  chacun mène à une page du guide. Pas de menu au-dessus, rien en dessous — on en sort en
  choisissant un bloc, pas en continuant à faire défiler. L’accueil du guide, lui, est
  `guide.html`, où mène le premier bloc.
-->
<body>
  <main id="contenu">
    <div id="mosaique"></div>
  </main>

  <script type="module">
    import { mosaiqueHtml, brancherMosaique } from './js/mosaique.js';
    document.getElementById('mosaique').outerHTML = mosaiqueHtml();
    brancherMosaique();
  </script>
</body>
</html>
