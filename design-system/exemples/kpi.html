<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carte KPI — exemples du design system MyDigitalSchool</title>
  <meta name="description" content="Les démonstrations de la carte KPI, rendues par le CSS de l’outil d’emprunt. Chaque section est montrée dans un cadre de la page Carte KPI.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;family=Bricolage+Grotesque:wght@800&amp;display=swap">
  <!-- Les seules feuilles dont ce composant a besoin : celles de l’application, rien de plus. Voir
       l’exemple du bouton pour le détail. -->
  <link rel="stylesheet" href="../../css/tokens.css">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/components.css">
  <style>
    body { padding: var(--space-lg); }
  </style>
</head>
<body>
  <!-- Les quatre teintes, avec les libellés et les chiffres du tableau de bord. -->
  <section data-demo="teintes">
    <div class="grid-4">
      <div class="kpi kpi--disponible"><span class="kpi__label">Matériel disponible</span><span class="kpi__value">128</span><span class="kpi__delta">exemplaires prêts à être empruntés</span></div>
      <div class="kpi kpi--emprunte"><span class="kpi__label">Emprunts en cours</span><span class="kpi__value">42</span><span class="kpi__delta">2 remises prévues aujourd’hui</span></div>
      <div class="kpi kpi--retard"><span class="kpi__label">Retards</span><span class="kpi__value">3</span><span class="kpi__delta">à relancer</span></div>
      <div class="kpi kpi--salle"><span class="kpi__label">Réservations salle à venir</span><span class="kpi__value">17</span><span class="kpi__delta">1 signalement à traiter</span></div>
    </div>
  </section>

  <!-- La carte neutre, sans teinte. Le tableau de bord n’en pose aucune. -->
  <section data-demo="neutre">
    <div class="grid-4">
      <div class="kpi"><span class="kpi__label">Matériel disponible</span><span class="kpi__value">128</span><span class="kpi__delta">exemplaires prêts à être empruntés</span></div>
    </div>
  </section>

  <!-- Une carte qui mène quelque part : un vrai lien, comme celui du tableau de bord. -->
  <section data-demo="lien">
    <div class="grid-4">
      <a class="kpi kpi--link kpi--retard" href="#/emprunts/retards"><span class="kpi__label">Retards</span><span class="kpi__value">3</span><span class="kpi__delta">à relancer</span></a>
    </div>
  </section>

  <!-- Ne laisse voir que la section demandée par le fragment, et annonce sa hauteur au cadre. -->
  <script type="module" src="../js/cadre-enfant.js"></script>
</body>
</html>
