<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cartes — exemples du design system MyDigitalSchool</title>
  <meta name="description" content="Les démonstrations de la carte, rendues par le CSS de l’outil d’emprunt. Chaque section est montrée dans un cadre de la page Cartes.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;family=Bricolage+Grotesque:wght@800&amp;display=swap">
  <!-- Les seules feuilles dont ce composant a besoin : celles de l’application, rien de plus. Voir
       l’exemple du bouton pour le détail. -->
  <link rel="stylesheet" href="../../css/tokens.css">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/components.css">
  <style>
    body { padding: var(--space-lg); }
  </style>
</head>
<body>
  <!-- La carte de base, et sa version sans ombre. Une carte porte un titre et un lien. -->
  <section data-demo="surfaces">
    <div class="grid-2">
      <div class="card">
        <div class="card__header"><h2 class="card__title">Retards</h2><a class="body-sm" href="#/emprunts">Tout voir →</a></div>
        <p class="body-sm text-secondary">Aucun retard pour le moment.</p>
      </div>
      <div class="card card--flat">
        <div class="card__header"><h2 class="card__title">Signalements à traiter</h2><a class="body-sm" href="#/maintenance">Tout voir →</a></div>
        <p class="body-sm text-secondary">Deux signalements ouverts depuis hier.</p>
      </div>
    </div>
  </section>

  <!-- La carte d’un objet du catalogue : image, état, nom, référence, une action. -->
  <section data-demo="materiel">
    <div class="grid-4">
      <div class="card card--item">
        <div class="card__media"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h3l1.5-2h7L17 7h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13" r="3.5"/></svg></div>
        <div class="card__body">
          <span class="badge badge--available">Disponible</span>
          <strong class="label-md">Canon R10 + 18-55</strong>
          <span class="body-tiny text-secondary">Réf. MDS-0029 · Armoire sécurisée</span>
          <button type="button" class="btn btn--secondary btn--sm">Réserver →</button>
        </div>
      </div>
      <div class="card card--item">
        <div class="card__media"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h3l1.5-2h7L17 7h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13" r="3.5"/></svg></div>
        <div class="card__body">
          <span class="badge badge--borrowed">Emprunté</span>
          <strong class="label-md">DJI Ronin RSC2</strong>
          <span class="body-tiny text-secondary">Réf. MDS-0014 · Armoire sécurisée</span>
          <button type="button" class="btn btn--secondary btn--sm">Réserver →</button>
        </div>
      </div>
    </div>
  </section>

  <!-- Ne laisse voir que la section demandée par le fragment, et annonce sa hauteur au cadre. -->
  <script type="module" src="../js/cadre-enfant.js"></script>
</body>
</html>
