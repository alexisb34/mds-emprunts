<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Formulaires — exemples du design system MyDigitalSchool</title>
  <meta name="description" content="Les démonstrations des champs de formulaire, rendues par le CSS de l’outil d’emprunt. Chaque section est montrée dans un cadre de la page Formulaires.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;family=Bricolage+Grotesque:wght@800&amp;display=swap">
  <!-- Les seules feuilles dont ce composant a besoin : celles de l’application, rien de plus. Voir
       l’exemple du bouton pour le détail. -->
  <link rel="stylesheet" href="../../css/tokens.css">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/components.css">
  <style>
    body { padding: var(--space-lg); }
  </style>
</head>
<body>
  <!-- Un champ de chaque sorte. Le libellé enveloppe le contrôle : c’est ce qui les associe. -->
  <section data-demo="champs">
    <div class="card stack">
      <label class="field"><span class="field__label">Nom du matériel</span><input class="input" type="text" placeholder="Canon R10"></label>
      <label class="field"><span class="field__label">Recherche</span><input class="input input--search" type="search" placeholder="Rechercher un matériel…"></label>
      <label class="field">
        <span class="field__label">Catégorie</span>
        <select class="select">
          <option>Photo</option>
          <option>Audio</option>
          <option>Bureautique</option>
        </select>
      </label>
      <label class="field"><span class="field__label">Motif</span><textarea class="textarea" placeholder="Tournage projet MBA"></textarea></label>
    </div>
  </section>

  <!-- Une aide, puis une erreur. aria-invalid pose le filet rouge ; le message se pose à côté. -->
  <section data-demo="aide-erreur">
    <div class="card stack">
      <label class="field"><span class="field__label">Code du matériel</span><input class="input" type="text" value="MDS-0029"><span class="field__hint">Quatre chiffres après MDS-, par exemple MDS-0029.</span></label>
      <label class="field"><span class="field__label">Code du matériel</span><input class="input" type="text" value="MDS-0029" aria-invalid="true"><span class="field__error">Ce code est déjà pris. Choisissez-en un autre.</span></label>
    </div>
  </section>

  <!-- aria-invalid sur les trois contrôles. Le filet rouge ne s’affiche que sur deux d’entre eux. -->
  <section data-demo="invalide">
    <div class="card stack">
      <label class="field"><span class="field__label">Champ</span><input class="input" type="text" value="MDS-" aria-invalid="true"></label>
      <label class="field">
        <span class="field__label">Liste</span>
        <select class="select" aria-invalid="true">
          <option>Photo</option>
          <option>Audio</option>
        </select>
      </label>
      <label class="field"><span class="field__label">Zone de texte</span><textarea class="textarea" aria-invalid="true">Tournage</textarea></label>
    </div>
  </section>

  <!-- Le même champ, actif puis désactivé. -->
  <section data-demo="desactive">
    <div class="card stack">
      <label class="field"><span class="field__label">Actif</span><input class="input" type="text" value="MDS-0029"></label>
      <label class="field"><span class="field__label">Désactivé</span><input class="input" type="text" value="MDS-0029" disabled></label>
    </div>
  </section>

  <!-- Case à cocher et interrupteur, tels que l’outil les écrit. -->
  <section data-demo="choix">
    <div class="stack">
      <label class="checkbox"><input type="checkbox" checked> Empêcher d’emprunter quand une personne est en retard</label>
      <label class="toggle"><input type="checkbox" checked><span class="toggle__track"></span> Comptes actifs uniquement</label>
    </div>
  </section>

  <!-- Ne laisse voir que la section demandée par le fragment, et annonce sa hauteur au cadre. -->
  <script type="module" src="../js/cadre-enfant.js"></script>
</body>
</html>
